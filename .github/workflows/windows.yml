name: Windows M5
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build --parallel 4
      - name: Shared and native tests
        run: |
          ctest --test-dir build --output-on-failure
          $testExit = $LASTEXITCODE
          Get-ChildItem build/test-results/*.txt | ForEach-Object { Get-Content $_.FullName }
          exit $testExit
      - name: Launch smoke
        run: |
          $process = Start-Process -FilePath .\build\worksidekick.exe -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Launch smoke failed: $($process.ExitCode)" }
      - name: Package native validation binaries
        if: always()
        run: |
          New-Item -ItemType Directory -Force build\portable | Out-Null
          Copy-Item build\*.exe build\portable
          Get-ChildItem build\portable\*.exe | ForEach-Object { & windeployqt --release --no-translations $_.FullName; if ($LASTEXITCODE -ne 0) { throw 'Deployment failed' } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-native-tests
          path: |
            build/portable/
            build/Testing/Temporary/LastTest.log
            build/test-results/
