name: Ubuntu M1
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev libgl1-mesa-dev libsecret-1-dev libatspi2.0-dev xvfb dbus-x11 gnome-keyring
      - run: /usr/bin/cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: /usr/bin/cmake --build build --parallel 2
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Secure store integration
        run: dbus-run-session -- bash scripts/test-keyring.sh
      - name: Launch smoke
        run: xvfb-run -a ./build/worksidekick --smoke-test
      - name: AT-SPI real event integration
        run: dbus-run-session -- xvfb-run -a env QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 ./build/test_atspi_runtime