name: Ubuntu M0
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev libsecret-1-dev xvfb dbus-x11 gnome-keyring
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Secure store integration
        run: dbus-run-session -- bash scripts/test-keyring.sh
      - name: Launch smoke
        run: xvfb-run -a ./build/worksidekick --smoke-test
